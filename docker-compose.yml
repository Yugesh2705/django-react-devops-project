services:
  db:
    image: "postgres:alpine"
    environment:
      - POSTGRES_USER=project_name
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=project_name
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data:delegated

  broker:
    image: "rabbitmq:alpine"

  result:
    image: "redis:alpine"
    ports:
      - "6379:6379"

  frontend:
    build:
      dockerfile: frontend/Dockerfile
      context: .
    volumes:
      - .:/app/
      - /app/node_modules
    ports:
      - "3000:3000"

  backend:
    build:
      dockerfile: backend/Dockerfile
      context: .
    ports:
      - "8000:8000"
    volumes:
      - .:/home/user/app/   # Changed this to map the root directory
    env_file: backend/.env
    depends_on:
      - db
      - broker
      - result
      - frontend

  celery:
    build:
      dockerfile: backend/Dockerfile
      context: .
    command: celery --app=project_name worker --loglevel=info
    volumes:
      - .:/home/user/app/   # Changed this to map the root directory
    env_file: backend/.env
    depends_on:
      - db
      - broker
      - result

  mailhog:
    image: mailhog/mailhog
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  dbdata:
    name: devops_project_dbdata

